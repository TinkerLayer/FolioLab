name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"          # Mondays: also runs the job with the optional reference data

jobs:
  # Everything in the repository, without the optional data (tests that need it are skipped and say so).
  python:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages
        run: python -m pip install -r requirements.txt scipy xlrd pyarrow
      - name: SDK tests
        working-directory: sdk/python
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests
      - name: Module tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($m in Get-ChildItem modules -Directory) {
            if (-not (Test-Path "$($m.FullName)\tests")) { continue }
            Write-Host "== $($m.Name)"
            Push-Location $m.FullName
            $env:PYTHONPATH = "..\..\sdk\python;."
            python -m unittest discover -s tests
            if ($LASTEXITCODE -ne 0) { $failed += $m.Name }
            Pop-Location
          }
          if ($failed) { throw "Failed: $($failed -join ', ')" }

  # The same tests with the optional data, downloaded from the original publishers on the runner (never stored).
  # Weekly and on demand only, so pushes do not download from NIST, Zenodo and OSF every time. A source that is
  # down makes this job fail without blocking the main job.
  optional-data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install -r requirements.txt scipy xlrd pyarrow
      - name: Fetch optional data
        run: python tools/fetch_optional_data.py all
      - name: Module tests with optional data
        shell: pwsh
        run: |
          $failed = @()
          foreach ($name in "elementrechner", "ftir") {
            Write-Host "== $name"
            Push-Location "modules\$name"
            $env:PYTHONPATH = "..\..\sdk\python;."
            python -m unittest discover -s tests
            if ($LASTEXITCODE -ne 0) { $failed += $name }
            Pop-Location
          }
          if ($failed) { throw "Failed: $($failed -join ', ')" }
