<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werkstoffe</title>
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --ink: #1d2027; --muted: #5d6472; --line: #d8dce4; --soft: #eef0f5;
  --accent: #3d5f70; --accent-ink: #ffffff; --accent-soft: rgba(61,95,112,.11); --accent2: #b45309;
  --err-bg: #fde7e7; --err-ink: #a50e0e; --ok-bg: #e6f4ef; --ok-ink: #12602a;
  --plot: #ffffff; --grid: #e8eaf0; --warn-bg: #fff4e0; --warn-ink: #7a4a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131519; --panel: #1b1e24; --ink: #e8eaf0; --muted: #9ca3b0; --line: #343945; --soft: #242832;
    --accent: #8fb6c9; --accent-ink: #10161a; --accent-soft: rgba(143,182,201,.15); --accent2: #f59e0b;
    --err-bg: #3b1a1a; --err-ink: #f6aea9; --ok-bg: #163126; --ok-ink: #a8dab5;
    --plot: #171a1f; --grid: #2a2f39; --warn-bg: #3a2c12; --warn-ink: #f0c98a;
  }
}
:root[data-theme="dark"] {
  --bg: #131519; --panel: #1b1e24; --ink: #e8eaf0; --muted: #9ca3b0; --line: #343945; --soft: #242832;
  --accent: #8fb6c9; --accent-ink: #10161a; --accent-soft: rgba(143,182,201,.15); --accent2: #f59e0b;
  --err-bg: #3b1a1a; --err-ink: #f6aea9; --ok-bg: #163126; --ok-ink: #a8dab5;
  --plot: #171a1f; --grid: #2a2f39; --warn-bg: #3a2c12; --warn-ink: #f0c98a;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100vh; overflow: hidden; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.link { border: 0; background: transparent; color: var(--accent); padding: 0 2px; text-decoration: underline; }
button:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], input:not([type]), select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; width: 100%; }
textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; min-height: 70px; resize: vertical; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
label.chk { display: flex; gap: 6px; align-items: center; color: var(--ink); font-size: 13px; margin: 6px 0; }
label .u { color: var(--muted); font-size: 11px; }
code { font-size: 12px; background: var(--soft); padding: 0 3px; border-radius: 3px; }
.small { font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 8px; }
.row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 6px; }

header { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; white-space: nowrap; }
.brand svg { color: var(--accent); }
.chips { display: flex; gap: 6px; flex: 1; overflow-x: auto; min-width: 0; padding: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--soft); white-space: nowrap; max-width: 260px; font-size: 12px; }
.chip span { overflow: hidden; text-overflow: ellipsis; }
.chip .k { color: var(--muted); font-size: 11px; }
.chip .x { border: 0; background: transparent; padding: 0 5px; color: var(--muted); }
body.lov-board { grid-template-rows: auto minmax(0, 1fr) auto; }
header .lov-only { display: none; }
body.lov-board header .lov-only { display: block; flex: 1; }

#menubar { display: flex; gap: 2px; padding: 2px 8px; background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
#menubar > .m { position: relative; }
#menubar > .m > button { border: 0; background: transparent; padding: 4px 10px; border-radius: 5px; }
#menubar > .m > button.open, #menubar > .m > button:hover { background: var(--accent-soft); }
.dd { position: absolute; top: 100%; left: 0; min-width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 4px; }
.dd button { display: flex; width: 100%; justify-content: space-between; gap: 18px; border: 0; background: transparent; text-align: left; padding: 5px 10px; border-radius: 5px; }
.dd button:hover:not(:disabled) { background: var(--accent-soft); }
.dd button .k { color: var(--muted); font-size: 12px; }
.dd button.on::before { content: "✓"; margin-right: -12px; color: var(--accent); }
.dd hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

main { display: grid; grid-template-columns: 52px minmax(0, 1fr) var(--lab-side, 420px); min-height: 0; }
#tools { display: flex; flex-direction: column; gap: 4px; padding: 6px 5px; background: var(--panel); border-right: 1px solid var(--line); }
#tools button { width: 42px; height: 42px; padding: 0; display: grid; place-items: center; border-color: transparent; background: transparent; font-size: 9.5px; color: var(--muted); line-height: 1; }
#tools button svg { margin-bottom: 1px; }
#tools button.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.viewer { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#opts { display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: var(--soft); border-bottom: 1px solid var(--line); min-height: 36px; font-size: 12px; flex-wrap: wrap; }
#opts .hint { color: var(--muted); flex: 1; min-width: 160px; }
#stage { position: relative; flex: 1; min-height: 0; background: var(--plot); overflow: hidden; }
#plot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
#plot text { font: 11px system-ui, sans-serif; fill: var(--ink); }
#plot .ax text { fill: var(--muted); }
#plot .pk { cursor: pointer; }
#plot .drag { cursor: grab; }
#html { position: absolute; inset: 0; overflow: auto; padding: 14px 18px; background: var(--plot); }
#tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); max-width: 340px; z-index: 5; white-space: pre-line; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 20px; background: var(--plot); }
#empty .box { border: 2px dashed var(--line); border-radius: 12px; padding: 24px 32px; max-width: 560px; }
#empty .box b { font-size: 15px; color: var(--ink); display: block; margin-bottom: 6px; }
#empty button { margin: 12px 4px 0; }
#stage.drop { outline: 2px dashed var(--accent); outline-offset: -8px; }
.tag { position: absolute; right: 12px; bottom: 8px; font-style: italic; font-size: 11.5px; color: var(--muted); pointer-events: none; }

aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 5px 7px; color: var(--muted); font-size: 12.5px; }
.tabs button.sel { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button.more { margin-left: auto; }
.tabmenu { display: flex; flex-direction: column; gap: 2px; min-width: 240px; }
.tabmenu button { text-align: left; border: 1px solid transparent; background: transparent; padding: 5px 8px; border-radius: 6px; }
.tabmenu button:hover, .tabmenu button:focus-visible { border-color: var(--accent); }
.tabmenu small { display: block; color: var(--muted); font-size: 11.5px; }
.pane { padding: 10px 12px 16px; overflow-y: auto; flex: 1; min-height: 0; }
.pane h4.sub { margin: 16px 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.pane h4.sub:first-child { margin-top: 2px; }
.pane details.lab-fold > summary { margin: 14px 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; cursor: pointer; }
.pane details.lab-fold > summary .cnt { text-transform: none; letter-spacing: 0; font-weight: 400; }
.note { padding: 8px 10px; border-radius: 6px; background: var(--accent-soft); font-size: 12px; margin: 6px 0; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.err { background: var(--err-bg); color: var(--err-ink); }
.note.ok { background: var(--ok-bg); color: var(--ok-ink); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kv b { font-weight: 600; }
.kv span:nth-child(odd) { color: var(--muted); }
.big { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tw { overflow: auto; max-height: 300px; border: 1px solid var(--line); border-radius: 6px; margin-top: 6px; }
table.res { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; width: 100%; }
table.res th, table.res td { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.res th { position: sticky; top: 0; background: var(--soft); font-weight: 600; z-index: 1; }
table.res td.l, table.res th.l { text-align: left; }
table.res td.wrap { white-space: normal; text-align: left; min-width: 120px; }
table.res tbody tr.click { cursor: pointer; }
table.res tbody tr.click:hover td { background: var(--soft); }
table.res tr.hl td { background: var(--accent-soft) !important; }
table.grid td { padding: 1px 2px; }
table.grid td input[type=text] { padding: 2px 4px; min-width: 52px; text-align: right; }
table.grid td button { padding: 0 6px; border: 0; background: transparent; color: var(--muted); }
table.cmp { border-collapse: collapse; font-size: 12.5px; }
table.cmp th, table.cmp td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.cmp td small, table.cmp th small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
table.cmp th button.link { font-size: 11px; font-weight: 400; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 9px; font-size: 12px; }
.seg button.sel { background: var(--accent); color: var(--accent-ink); }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid currentColor; white-space: nowrap; color: var(--muted); }
.badge.model { color: var(--warn-ink); }
.list { border: 1px solid var(--line); border-radius: 6px; margin-top: 6px; max-height: 240px; overflow-y: auto; }
.list .it { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.list .it:last-child { border-bottom: 0; }
.list .it .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.list .it .cv { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.list .it button { padding: 0 6px; border: 0; background: transparent; color: var(--muted); }
.list .it button:hover { color: var(--ink); }
.list .empty { padding: 10px; color: var(--muted); font-size: 12px; }
.refs { font-size: 12px; margin: 4px 0 0; padding-left: 18px; }
.refs li { margin: 2px 0; }
.ok-y { color: var(--ok-ink); } .ok-n { color: var(--err-ink); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

footer { display: flex; gap: 14px; align-items: center; padding: 4px 12px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
footer #stPos { min-width: 260px; color: var(--ink); }
footer #stInfo { flex: 1; overflow: hidden; text-overflow: ellipsis; }
#busy { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); }
#busy::before { content: ""; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 0; width: min(480px, calc(100vw - 32px)); box-shadow: 0 16px 48px rgba(0,0,0,.3); }
dialog.wide { width: min(820px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(8,12,14,.45); }
dialog h3 { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 15px; }
dialog .body { padding: 8px 16px 12px; max-height: 72vh; overflow-y: auto; }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
dialog .foot .left { margin-right: auto; display: flex; gap: 8px; align-items: center; }
#toasts { position: fixed; right: 14px; bottom: 34px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(460px, calc(100vw - 28px)); }
.toast { padding: 9px 12px; border-radius: 8px; background: var(--ok-bg); color: var(--ok-ink); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.15); font-size: 12.5px; white-space: pre-line; }
.toast.err { background: var(--err-bg); color: var(--err-ink); }

@media (max-width: 980px) {
  body { overflow: auto; height: auto; }
  main { grid-template-columns: 52px minmax(0, 1fr); }
  aside { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  #stage { min-height: 60vh; }
}
@media (max-width: 700px) { header { flex-wrap: wrap; } header .chips { order: 9; flex-basis: 100%; } #menubar, #opts { flex-wrap: wrap; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/><circle cx="12" cy="12" r="1.6"/></svg>
    <span data-i18n="ws.brand">Werkstoffe</span>
  </div>
  <span id="crumbs"></span>

</header>

<nav id="menubar" aria-label="Menü"></nav>

<main>
  <div id="tools" role="toolbar" aria-label="Bereiche"></div>
  <div class="viewer">
    <div id="opts">
      <span class="hint" id="optHint"></span>
      <div class="seg" id="viewSeg"></div>
      <button id="viewAll" data-i18n="ws.all" data-i18n-title="ws.all_t" title="Ganzer Bereich (Doppelklick)">Ganz</button>

      <svg id="plot"></svg>

</footer>

<input type="file" id="file" multiple hidden>
<dialog id="dlg"><form method="dialog"><h3 id="dlgTitle"></h3><div class="body" id="dlgBody"></div><div class="foot" id="dlgFoot"></div></form></dialog>
<div id="toasts" aria-live="polite"></div>

<script src="/lab/sdk.js"></script>
<script src="labenv.js"></script>
<script src="labindex.js"></script>

<script>/* Rückfall: Modulserver älter als die Seite (vor einer Aktualisierung gestartet) liefert labenv.js/labindex.js nicht.
   Die Seite arbeitet dann ohne Umgebungen und Projektindex weiter und meldet, dass ein Neustart nötig ist. */
(function (g) {
  const msg = "Der laufende Modulserver ist älter als diese Seite. Bitte das Modul bzw. den Hub neu starten; bis dahin fehlen Umgebungen und Projektindex.";
  if (!g.LabEnv) g.LabEnv = { stub: true, create: (o) => ({ ready: false, info: null, open: async () => o.toast(msg, true), save() {}, flush: () => Promise.resolve(), check() {}, dialog: () => o.toast(msg, true) }) };
  const no = (a, t) => { t(msg, true); return Promise.resolve(null); };
  if (!g.LabIndex) g.LabIndex = { stub: true, add: no, addMany: no, browse: no, history: no, exportDeps: no };
})(window);</script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const WS_T = {
  de: { "ws.brand": "Werkstoffe", "ws.lab": "Zum Bericht …", "ws.lab_t": "Diagramme, Tabellen, Kennwerte und Quellen in einen Folio Lab Bericht übernehmen",
        "ws.all": "Ganz", "ws.all_t": "Ganzer Bereich (Doppelklick)" },
  en: { "ws.brand": "Materials", "ws.lab": "To report …", "ws.lab_t": "Send charts, tables, values and sources to a Folio Lab report",
        "ws.all": "Full", "ws.all_t": "Full range (double-click)" },
};
if (window.LabUI) LabUI.strings(WS_T);
const lang = () => (window.LabUI && LabUI.lang ? LabUI.lang() : "de");
const EN = () => lang() === "en";
const L = (de, en) => (EN() ? en : de);
let OV = null, META = null;

// ---------------------------------------------------------------- Zahlen
const NF = {};
function fmt(v, nd = 3) {
  if (v === null || v === undefined || v === "" || !isFinite(v)) return "–";
  const k = lang() + nd;
  NF[k] = NF[k] || new Intl.NumberFormat(EN() ? "en-GB" : "de-DE", { maximumFractionDigits: nd, minimumFractionDigits: 0, useGrouping: false });
  return NF[k].format(v);
}
function sig(v, n = 4) {                     // signifikante Stellen, wissenschaftlich bei sehr grossen/kleinen Werten
  if (v === null || v === undefined || v === "" || !isFinite(v)) return "–";
  if (v === 0) return "0";
  const a = Math.abs(v);
  if (a >= 1e6 || a < 1e-3) {
    const e = Math.floor(Math.log10(a)), m = v / 10 ** e;
    return fmt(+m.toPrecision(n), n) + "·10" + String(e).replace(/-/, "⁻").replace(/\d/g, d => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
  }
  return fmt(+v.toPrecision(n), Math.max(0, n - 1 - Math.floor(Math.log10(a))));
}
const pnum = (v) => { const s = String(v ?? "").trim().replace(",", "."); if (s === "") return null; const x = Number(s); return isFinite(x) ? x : null; };
const numList = (s) => String(s || "").split(/[\s;]+|,(?=\s)|\n/).map(t => pnum(t)).filter(v => v !== null);

// ---------------------------------------------------------------- Server, Dialoge
const S = { busy: 0, grp: "auswahl", tool: "auswahl", inp: {}, res: {}, err: {}, view: {}, items: [], phases: [], ext: [], seq: {} };
async function api(path, body, raw) {
  const opt = { method: body === undefined ? "GET" : "POST" };
  if (body !== undefined) { opt.body = raw ? body : JSON.stringify(body); opt.headers = { "Content-Type": raw ? "application/octet-stream" : "application/json" }; }
  try {
    const r = await fetch(path, opt);
    const j = await r.json().catch(() => ({ error: L("Antwort unlesbar", "Unreadable response") }));
    j._status = r.status;
    return j;
  } catch (e) { return { error: L("Keine Verbindung zum Modul (", "No connection to the module (") + e.message + ")", _status: 0 }; }
}
function busy(d) { S.busy += d; $("#busy").hidden = S.busy <= 0; }
async function withBusy(fn) { busy(1); try { return await fn(); } finally { busy(-1); } }
function toast(msg, err = false) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), err ? 9000 : 5000);
}
function download(name, text, type = "text/csv;charset=utf-8") {
  const blob = text instanceof Blob ? text : new Blob(["﻿" + text], { type });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);

      h += `<h4 class="sub">${esc(L("Rangliste", "Ranking"))} · ${r.rank.n_ok}</h4>` +

      if (r.rank.excluded.length) h += fold("excl", L("Ausgeschlossen", "Excluded"), tbl([L("Werkstoff", "Material"), L("Grund", "Reason")], r.rank.excluded.slice(0, 200).map(x => [esc(x.name), esc(x.why.join(", "))]), { h: 220 }), `(${r.rank.excluded.length})`);
    }
    return h + refsHtml(r.refs);

  },
  kristall: (r) => {
    const c = r.cell;
    let h = kv([[L("Phase", "Phase"), esc(r.name) + (r.formula ? ` · ${esc(r.formula)}` : "")], [L("Raumgruppe", "Space group"), esc(r.spacegroup || "–") + " · " + esc(sysName(r.system))],
      ["a, b, c", `${fmt(c.a, 4)}, ${fmt(c.b, 4)}, ${fmt(c.c, 4)} Å`], ["α, β, γ", `${fmt(c.alpha, 2)}, ${fmt(c.beta, 2)}, ${fmt(c.gamma, 2)}°`],
      ["V", `${fmt(c.V, 2)} Å³`], [L("Dichte (Röntgen)", "Density (X-ray)"), `${fmt(r.rho, 3)} g/cm³`], [L("Atome je Zelle", "Atoms per cell"), fmt(r.Z_atoms, 2)],
      ["λ", `${fmt(r.lam[0], 6)} Å`],

    const row = rows[r0 + n] || (rows[r0 + n] = {});
    parts.forEach((p, q) => { const col = cols[c + q]; if (!col) return; if (col.chk) row[col.k] = /^(1|x|ja|yes|true|durchl|run)/i.test(p.trim()); else { const v = pnum(p); row[col.k] = v === null ? p.trim() : v; } });

  renderPane(); runSoon(0);
}
function gridCols(k) {

const ROLES = {

async function mapDialog(title, roles, cols) {
  const guess = (role) => { const re = { sa: /σ\s*a|sig.*a|ampl|sa\b/i, sm: /σ\s*m|mittel|mean|sm\b/i, N: /^n\b|zyk|cycl|lebens|life/i, runout: /durchl|run/i, F: /^f\b|kraft|force|load/i, d1: /d1|diag/i, d2: /d2/i, D: /^d$|kugel|ball/i,
    d: /korn|grain|^d\b/i, s: /σ|sig|stress|spann|festig|^s\b/i, T: /^t\b|temp/i, t: /zeit|time|^t_?r|bruch/i, rate: /rate|ε|eps|kriech/i, v: /.*/, E: /pot|^e\b|volt/i, i: /strom|curr|^i\b|amp/i }[role];
    const k = cols.findIndex(c => re && re.test(c.name)); return k; };
  const html = roles.map(([k, lab, req], n) => { const g = guess(k); return `<label>${esc(lab)}${req ? "" : ` <span class="u">(${esc(L("optional", "optional"))})</span>`}</label><select data-role="${k}"><option value="-1">–</option>${cols.map((c, q) => `<option value="${q}"${(g >= 0 ? g : (req ? Math.min(n, cols.length - 1) : -2)) === q ? " selected" : ""}>${esc(c.name)}${c.unit ? " [" + esc(c.unit) + "]" : ""}</option>`).join("")}</select>`; }).join("");
  const r = await dialog(title, html, [{ value: "cancel", label: L("Abbrechen", "Cancel") }, { value: "ok", label: L("Übernehmen", "Apply"), primary: true }]);
  if (r !== "ok") return null;
  const m = {}; $$("[data-role]", $("#dlgBody")).forEach(s => { m[s.dataset.role] = +s.value; });
  for (const [k, lab, req] of roles) if (req && m[k] < 0) { toast(L(`Spalte für ${lab} fehlt.`, `Column for ${lab} missing.`), true); return null; }
  return m;
}
function fillFromColumns(target, m, colVals) {
  const n = Math.max(...Object.values(colVals).map(a => a.length));
  if (target === "weibull") { S.inp.weibull.values = colVals.v.filter(v => v !== null && isFinite(v)).map(v => String(v)).join(" "); return; }
  if (target === "korrosion") return;
  const roles = ROLES[target]().map(r => r[0]);
  const rows = [];
  for (let q = 0; q < n; q++) {
    const row = {};
    for (const k of roles) if (m[k] >= 0 && colVals[k]) { const v = colVals[k][q]; row[k] = k === "runout" ? !!(v && +v) : (v === null || v === undefined ? "" : v); }
    if (Object.values(row).some(v => v !== "" && v !== false)) rows.push(row);

}

let pickCb = null;
function pickFile(accept, cb, multiple = false) { const f = $("#file"); f.accept = accept; f.multiple = multiple; pickCb = cb; f.click(); }
async function loadFile(f, kind = "") {
  const buf = await f.arrayBuffer();
  const j = await withBusy(() => api("api/load?name=" + encodeURIComponent(f.name) + (kind ? "&kind=" + kind : ""), buf, true));
  if (j.error) { toast(`${f.name}: ${j.error}`, true); return null; }
  delete j._status;
  S.items = S.items.filter(x => x.id !== j.id); S.items.push(j);
  if (j.kind === "cif") await loadPhases();
  renderChips(); saveSoon();
  return j;
}
async function openFiles(files, kind = "") {
  let last = null;
  for (const f of files) { const d = await loadFile(f, kind); if (d) last = d; }
  if (!last) return;
  if (last.kind === "xrd") { S.inp.xrd.item = last.id; switchTool("xrd"); runSoon(0); }
  else if (last.kind === "cif") { toast(L(`CIF „${last.phase}“ geladen: unter Kristall und XRD wählbar.`, `CIF “${last.phase}” loaded: available under Crystal and XRD.`)); if (S.tool === "kristall") { S.inp.kristall.phase = last.phase_id; S.inp.kristall.cust.on = false; } renderPane(); runSoon(0); }
  else if (last.kind === "hardtable") { S.inp.haerte.table = last.id; switchTool("haerte"); renderPane(); runSoon(0); }
  else if (last.kind === "table") {
    if (["ermuedung", "weibull", "haerte", "kriechen"].includes(S.tool)) gridFromTable(S.tool === "weibull" ? "values" : "rows", last.id);
    else { S.inp.korrosion.item = last.id; S.inp.korrosion.data = null; switchTool("korrosion"); await loadKcols(); }
  }
}
async function loadKcols() {
  const i = S.inp.korrosion;

  const tb = await api("api/tool/table", { item: i.item });
  S.kcols = tb.error ? [] : tb.columns.map(c => ({ name: c.name, unit: c.unit }));
  if (S.kcols.length >= 2 && (i.colE >= S.kcols.length || i.colI >= S.kcols.length)) { i.colE = 0; i.colI = 1; }

}

    { label: () => L("Zum Bericht …", "To report …"), enabled: () => !!window.Lab && reportable().length > 0, act: sendToReport },
    { label: () => L("Ergebnisse in den Projektindex …", "Results to the project index …"), enabled: () => indexEntries().length > 0, act: indexAll },
    { label: () => L("Projektindex …", "Project index …"), act: () => LabIndex.browse(api, toast) },
    { label: () => L("Ansicht als SVG speichern", "Save view as SVG"), enabled: () => !!PL.spec && $("#plot").style.display !== "none", act: saveSvg },
    "-",
    { label: () => L("Alle Dateien schliessen", "Close all files"), enabled: () => S.items.length > 0, act: async () => { if (confirm(L("Alle geladenen Dateien schliessen?", "Close all loaded files?"))) { for (const x of [...S.items]) await removeItem(x.id); } } },
  ] },
  { label: () => L("Werkzeuge", "Tools"), items: () => GROUPS.flatMap((g, n) => [...(n ? ["-"] : []), ...g.tools.map(t => ({ label: () => tname(t) + " · " + NAMES[t][EN() ? 3 : 2], check: () => S.tool === t, act: () => switchTool(t) }))]) },
  { label: () => L("Ansicht", "View"), items: [
    { label: () => L("Ganzer Bereich", "Full range"), key: "0", act: resetView },
    { label: () => L("Fenstergrössen zurücksetzen", "Reset window sizes"), enabled: () => !!(window.LabUI && LabUI.resetSizes), act: () => LabUI.resetSizes("werkstoffe") },
  ] },
  { label: () => L("Hilfe", "Help"), items: [
    { label: () => L("Kennzeichnungen …", "Labels …"), act: () => dialog(L("Kennzeichnungen", "Labels"), `<p>${esc(L("† nicht gegen das Original geprüft (aus dem Gedächtnis nach der genannten Quelle).", "† not checked against the original (from memory after the cited source)."))}</p>
      <p>${esc(L("„schematisch“: Zustandsdiagramm aus zitierten Eckpunkten gezeichnet. „berechnet“: aus einem Modell (Lösungsmodell, Struktur, Formel), nicht gemessen. „berechnet (DFT)“: Materials Project, Dichtefunktionaltheorie.", "“schematic”: phase diagram drawn from cited key points. “computed”: from a model (solution model, structure, formula), not measured. “computed (DFT)”: Materials Project, density functional theory."))}</p>
      <p>${esc(L("Härte-Umwertung nur mit einer eigenen Tabelle (eigene Kopie der Norm); sonst nur die gekennzeichnete Faustregel. Keine ICDD-Daten: Vergleichsmuster werden aus Strukturen berechnet.", "Hardness conversion only with an own table (own copy of the standard); otherwise only the labelled rule of thumb. No ICDD data: reference patterns are computed from structures."))}</p>`, [{ value: "ok", label: "OK", primary: true }]) },
  ] },
];
function saveSvg() {
  const s = $("#plot").cloneNode(true);
  s.setAttribute("xmlns", SVGNS); s.setAttribute("width", $("#stage").clientWidth); s.setAttribute("height", $("#stage").clientHeight);
  s.insertBefore(Object.assign(document.createElementNS(SVGNS, "style"), { textContent: `text{font:11px sans-serif;fill:${css("--ink")}}` }), s.firstChild);
  download(`werkstoffe_${S.tool}.svg`, new XMLSerializer().serializeToString(s), "image/svg+xml");
}
let menusBound = false;
function buildMenus() {
  const bar = $("#menubar");
  closeMenus(); bar.innerHTML = "";
  MENUS.forEach((m, mi) => {
    const w = document.createElement("div"); w.className = "m";
    const b = document.createElement("button"); b.type = "button"; b.textContent = m.label();
    b.addEventListener("click", (e) => { e.stopPropagation(); const open = b.classList.contains("open"); closeMenus(); if (!open) openMenu(mi, w, b); });
    b.addEventListener("mouseenter", () => { if ($(".dd") && !b.classList.contains("open")) { closeMenus(); openMenu(mi, w, b); } });
    w.appendChild(b); bar.appendChild(w);
  });
  if (!menusBound) { document.addEventListener("click", closeMenus); menusBound = true; }
}
function closeMenus() { $$(".dd").forEach(d => d.remove()); $$("#menubar button.open").forEach(b => b.classList.remove("open")); }
function openMenu(mi, w, b) {
  b.classList.add("open");
  const dd = document.createElement("div"); dd.className = "dd"; dd.setAttribute("role", "menu");
  const items = typeof MENUS[mi].items === "function" ? MENUS[mi].items() : MENUS[mi].items;
  for (const it of items) {
    if (it === "-") { dd.appendChild(document.createElement("hr")); continue; }
    const x = document.createElement("button");
    x.type = "button"; x.disabled = it.enabled ? !it.enabled() : false; x.setAttribute("role", "menuitem");
    if (it.check && it.check()) x.classList.add("on");
    x.innerHTML = `<span>${esc(it.label())}</span>${it.key ? `<span class="k">${esc(it.key)}</span>` : ""}`;
    x.addEventListener("click", (e) => { e.stopPropagation(); closeMenus(); it.act(); });
    dd.appendChild(x);
  }
  w.appendChild(dd);
}

// ---------------------------------------------------------------- Start
function bind() {
  bindPlot();
  $("#viewSeg").addEventListener("click", (e) => { const b = e.target.closest("[data-view]"); if (!b) return; S.view[S.tool] = b.dataset.view; showTool(); saveSoon(); });
  $("#viewAll").addEventListener("click", resetView);
  $("#file").addEventListener("change", (e) => { const fs = [...e.target.files]; e.target.value = ""; const cb = pickCb; pickCb = null; if (fs.length && cb) cb(fs); });
  $("#stage").addEventListener("click", (e) => {
    const b = e.target.closest("[data-eact]"); if (!b) return;
    const a = b.dataset.eact;
    if (a === "ex") loadExample(S.tool); else act(a);
  });
  const stage = $("#stage");
  stage.addEventListener("dragover", (e) => { e.preventDefault(); stage.classList.add("drop"); });
  stage.addEventListener("dragleave", () => stage.classList.remove("drop"));
  stage.addEventListener("drop", (e) => {
    e.preventDefault(); stage.classList.remove("drop");
    const fs = [...e.dataTransfer.files];
    const kindOf = (n) => /\.cif$/i.test(n) ? "cif" : (META.accepts || []).some(x => x !== ".csv" && x !== ".txt" && n.toLowerCase().endsWith(x)) ? "xrd" : (S.tool === "xrd" ? "xrd" : "table");
    (async () => { for (const f of fs) await openFiles([f], kindOf(f.name)); })();
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input,textarea,select") || $("#dlg").open) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "o") { e.preventDefault(); act("open"); }
    else if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key === "0") resetView();
  });
}
async function init() {
  META = await api("api/meta");
  if (META.error) { toast(META.error, true); return; }
  for (const [t, d] of Object.entries(DEF)) S.inp[t] = clone(d);
  if (META.plies && META.plies.length) S.inp.laminat.material = META.plies.find(n => /AS4|CFK|carbon/i.test(n)) || META.plies[0];
  S.items = META.items || [];
  await loadPhases();
  bind(); buildMenus(); renderTools(); renderTabs(); renderPane(); renderChips();
  if (window.Lab) { $("#labBtn").hidden = false; $("#labBtn").addEventListener("click", sendToReport); }
  window.ENVS = LabEnv.create({
    api, toast, label: $("#envName"),
    keep: ["name", "kind"],
    list: () => S.items, sel: () => 0,
    reset: () => { S.items = []; S.res = {}; S.err = {}; },
    add: async (d) => { S.items.push(d); },
    extra: () => ({ tool: S.tool, inp: S.inp, view: S.view, last: S.last || {}, seen: S.seen || {} }), summary: envSummary,
    // Berichtsauftrag aller berechneten Werkzeuge, damit „Import“ im Bericht diese Umgebung lesen kann
    report: () => { const done = reportable(); return done.length ? { sections: done.map(t => ({ tool: t, req: REQ[t](S.inp[t]) })), lang: lang(), include: {}, title: L("Werkstoffe: ", "Materials: ") + done.map(tname).join(", ") } : null; },
    done: async (_sel, extra) => {
      for (const [t, d] of Object.entries(DEF)) S.inp[t] = merge(d, extra && extra.inp ? extra.inp[t] : undefined);
      if (!S.inp.laminat.material && META.plies && META.plies.length) S.inp.laminat.material = META.plies.find(n => /AS4|CFK|carbon/i.test(n)) || META.plies[0];
      S.view = (extra && extra.view) || {}; S.last = (extra && extra.last) || {}; S.seen = (extra && extra.seen) || {};
      S.res = {}; S.err = {};
      await loadPhases();
      renderChips();
      if (S.inp.korrosion.item) await loadKcols();
      const cur = extra && extra.tool && REQ[extra.tool] ? extra.tool : "auswahl";
      switchTool(cur);
      // übrige Werkzeuge mit eigenen Eingaben im Hintergrund nachrechnen (Bericht „alle“, Übersicht)
      (async () => { for (const t of Object.keys(DEF)) if (t !== cur && t !== "karten" && (S.seen[t] || JSON.stringify(S.inp[t]) !== JSON.stringify(DEF[t])) && (!READY[t] || READY[t](S.inp[t]))) await runTool(t); })();
      if (OV) setTimeout(() => OV.sync(), 0);
    },
  });
  await withBusy(() => ENVS.open());
  if (!ENVS.ready) switchTool(S.tool);
  if (window.LabUI) {
    LabUI.langSwitch($("#langSw")); LabUI.apply(); if (LabUI.sizes) LabUI.sizes("werkstoffe");
    LabUI.onLang(async () => { buildMenus(); renderTools(); renderTabs(); await loadPhases(); for (const t of Object.keys(S.res)) delete S.res[t]; renderPane(); runTool(S.tool); });
  }
  if (window.LabOverview) {
    OV = LabOverview.create({
      api: (p, b) => api(p, b), toast, module: "werkstoffe", envs: () => window.ENVS,
      detail: [$("#menubar"), $("main")], crumbs: $("#crumbs"),
      values: { catalogue: valCatalogue, apply: (rows) => { S.ext = LabOverview.extValues(S.ext, rows).list; }, version: META.version || "" },
      imports: WS_IMP,
      onView: (v) => { if (v === "detail") setTimeout(drawPlot, 0); },
    });
    if (OV) { OV.start(); if (OV.ok) $("#envName").remove(); }
  }
}
init();
</script>
